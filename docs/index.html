<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1f6feb">
<title>chatvault</title>
<style>
  :root { color-scheme: light dark; --bg:#fff; --fg:#1b1f24; --mut:#667085; --line:#d8dee4; --card:#f6f8fa; --acc:#1f6feb; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0d1117; --fg:#e6edf3; --mut:#8b949e; --line:#30363d; --card:#161b22; --acc:#58a6ff; } }
  * { box-sizing: border-box; }
  body { margin:0 auto; max-width:760px; padding:16px; background:var(--bg); color:var(--fg); font:16px/1.5 system-ui, sans-serif; }
  h1 { font-size:1.4rem; margin:0; }
  .mut { color:var(--mut); font-size:.875rem; margin:.25rem 0; }
  .row { display:flex; gap:8px; flex-wrap:wrap; margin:12px 0; }
  button, .btn, select { font:inherit; min-height:44px; padding:8px 14px; border:1px solid var(--line); border-radius:8px; background:var(--card); color:var(--fg); cursor:pointer; }
  .btn.main { background:var(--acc); border-color:var(--acc); color:#fff; display:inline-flex; align-items:center; }
  input[type=search] { width:100%; font:inherit; min-height:44px; padding:8px 12px; border:1px solid var(--line); border-radius:8px; background:var(--bg); color:var(--fg); }
  .item { display:block; width:100%; text-align:left; margin:8px 0; padding:12px; border:1px solid var(--line); border-radius:8px; background:var(--card); }
  .item b { display:block; overflow-wrap:anywhere; }
  .item span { display:block; color:var(--mut); font-size:.875rem; overflow-wrap:anywhere; }
  .msg { margin:10px 0; padding:10px 12px; border-radius:8px; border:1px solid var(--line); white-space:pre-wrap; overflow-wrap:anywhere; }
  .msg.user { background:var(--card); }
  .msg small { display:block; color:var(--mut); margin-bottom:4px; }
</style>
</head>
<body>
<header>
  <h1>chatvault</h1>
  <p class="mut">Your Claude and ChatGPT chats, searchable on this device. Nothing is uploaded.</p>
  <p class="mut" id="stats"></p>
</header>

<main id="home">
  <div class="row">
    <label class="btn main">Import export file
      <input id="file" type="file" accept=".zip,.json,application/zip,application/json" multiple hidden>
    </label>
    <select id="exp" aria-label="Export">
      <option value="">Export…</option>
      <option value="chat">Fine-tuning JSONL (whole chats)</option>
      <option value="user">Fine-tuning JSONL (only my messages)</option>
      <option value="archive">Full archive (.json, re-importable)</option>
    </select>
    <button id="wipe">Delete all</button>
  </div>
  <input id="q" type="search" placeholder="Search your chats…" autocomplete="off">
  <p class="mut" id="status" role="status"></p>
  <div id="list"></div>
</main>

<main id="conv" hidden>
  <div class="row"><button id="back">← Back</button></div>
  <h2 id="ctitle"></h2>
  <div id="msgs"></div>
</main>

<script>
// ---------------------------------------------------------------- core (no DOM)
const iso = v => typeof v === 'number' ? new Date(v * 1000).toISOString() : (v ? String(v) : null);

function parseChatGPT(data) {
  return data.map(c => {
    const map = c.mapping || {};
    let chain = [], node = c.current_node;
    if (node) {
      while (node && map[node]) { chain.push(map[node]); node = map[node].parent; }
      chain.reverse();
    } else {
      chain = Object.values(map).sort((a, b) =>
        ((a.message || {}).create_time || 0) - ((b.message || {}).create_time || 0));
    }
    const messages = [];
    for (const e of chain) {
      const m = e.message;
      if (!m) continue;
      const role = (m.author || {}).role;
      if (role !== 'user' && role !== 'assistant') continue;
      const text = ((m.content || {}).parts || []).filter(p => typeof p === 'string').join('\n').trim();
      if (text) messages.push({ role, text, created_at: iso(m.create_time) });
    }
    return { source: 'chatgpt', nid: c.id || c.conversation_id, title: c.title,
             created_at: iso(c.create_time), updated_at: iso(c.update_time), messages };
  });
}

function parseClaude(data) {
  return data.map(c => {
    const messages = [];
    for (const m of c.chat_messages || []) {
      let text = (m.text || '').trim();
      if (!text) text = (m.content || []).filter(b => b.type === 'text').map(b => b.text || '').join('\n').trim();
      if (text) messages.push({ role: m.sender === 'human' ? 'user' : 'assistant', text, created_at: iso(m.created_at) });
    }
    return { source: 'claude', nid: c.uuid, title: c.name,
             created_at: iso(c.created_at), updated_at: iso(c.updated_at), messages };
  });
}

function parseGeneric(data) {
  return (Array.isArray(data) ? data : [data]).map(c => ({
    source: c.source || 'other', nid: c.id == null ? null : String(c.id), title: c.title,
    created_at: iso(c.created_at), updated_at: iso(c.updated_at),
    messages: (c.messages || []).filter(m => (m.text || '').trim())
      .map(m => ({ role: m.role, text: m.text, created_at: iso(m.created_at) })),
  }));
}

function detectAndParse(data) {
  if (Array.isArray(data) && data.length && data[0] && typeof data[0] === 'object') {
    if ('mapping' in data[0]) return parseChatGPT(data);
    if ('chat_messages' in data[0]) return parseClaude(data);
  }
  if (data && typeof data === 'object') return parseGeneric(data);
  throw new Error('Unrecognised export format');
}

// 'new' | 'updated' | 'same' — same rule as the CLI: older copies never overwrite newer ones.
function mergeStatus(old, conv) {
  if (!old) return 'new';
  if (old.updated_at === conv.updated_at && old.messages.length === conv.messages.length) return 'same';
  if (old.updated_at && conv.updated_at && conv.updated_at < old.updated_at) return 'same';
  return 'updated';
}

// Reads conversations*.json out of a .zip (or a bare .json) without loading the whole zip.
async function readExport(file) {
  const head = new Uint8Array(await file.slice(0, 2).arrayBuffer());
  if (!(head[0] === 0x50 && head[1] === 0x4b)) return [JSON.parse(await file.text())];
  const tail = new DataView(await file.slice(Math.max(0, file.size - 65558)).arrayBuffer());
  let e = -1;
  for (let i = tail.byteLength - 22; i >= 0; i--) if (tail.getUint32(i, true) === 0x06054b50) { e = i; break; }
  if (e < 0) throw new Error('Not a valid zip file');
  const count = tail.getUint16(e + 10, true), cdSize = tail.getUint32(e + 12, true), cdOff = tail.getUint32(e + 16, true);
  if (cdOff === 0xffffffff) throw new Error('Zip is too large (zip64). Unzip it and import conversations.json');
  const cdBuf = await file.slice(cdOff, cdOff + cdSize).arrayBuffer();
  const cd = new DataView(cdBuf), dec = new TextDecoder(), out = [];
  for (let n = 0, p = 0; n < count && cd.getUint32(p, true) === 0x02014b50; n++) {
    const method = cd.getUint16(p + 10, true), csize = cd.getUint32(p + 20, true);
    const nlen = cd.getUint16(p + 28, true), xlen = cd.getUint16(p + 30, true), clen = cd.getUint16(p + 32, true);
    const off = cd.getUint32(p + 42, true);
    const name = dec.decode(new Uint8Array(cdBuf, p + 46, nlen));
    p += 46 + nlen + xlen + clen;
    if (!/(^|\/)conversations[^\/]*\.json$/.test(name)) continue;
    const lh = new DataView(await file.slice(off, off + 30).arrayBuffer());
    const start = off + 30 + lh.getUint16(26, true) + lh.getUint16(28, true);
    let stream = file.slice(start, start + csize).stream();
    if (method === 8) stream = stream.pipeThrough(new DecompressionStream('deflate-raw'));
    else if (method !== 0) throw new Error('Unsupported zip compression');
    out.push(JSON.parse(await new Response(stream).text()));
  }
  if (!out.length) throw new Error('No conversations.json inside the zip');
  return out;
}

function searchConvs(convs, query, limit = 50) {
  const terms = query.toLowerCase().split(/\s+/).filter(Boolean);
  const sorted = [...convs].sort((a, b) => (b.updated_at || '').localeCompare(a.updated_at || ''));
  if (!terms.length) return sorted.slice(0, limit).map(conv => ({ conv, snippet: conv.messages.length + ' messages' }));
  const out = [];
  for (const conv of sorted) {
    for (const m of conv.messages) {
      const low = m._l || (m._l = m.text.toLowerCase());
      if (!terms.every(t => low.includes(t))) continue;
      const i = low.indexOf(terms[0]);
      out.push({ conv, snippet: (i > 60 ? '… ' : '') + m.text.slice(Math.max(i - 60, 0), i + 100).replace(/\s+/g, ' ') });
      break;
    }
    if (out.length >= limit) break;
  }
  return out;
}

function exportText(convs, fmt) {
  const clean = c => c.messages.map(m => ({ role: m.role, text: m.text, created_at: m.created_at }));
  if (fmt === 'archive') return JSON.stringify(convs.map(c => ({
    source: c.source, id: c.nid, title: c.title, created_at: c.created_at, updated_at: c.updated_at, messages: clean(c) })));
  if (fmt === 'user') return convs.flatMap(c => c.messages.filter(m => m.role === 'user')
    .map(m => JSON.stringify({ text: m.text }))).join('\n') + '\n';
  return convs.filter(c => c.messages.length).map(c => JSON.stringify({
    messages: c.messages.map(m => ({ role: m.role, content: m.text })) })).join('\n') + '\n';
}

if (typeof module !== 'undefined') module.exports = { detectAndParse, mergeStatus, readExport, searchConvs, exportText };

// ---------------------------------------------------------------- app (DOM + IndexedDB)
if (typeof document !== 'undefined') (async () => {
  const $ = id => document.getElementById(id);
  const el = (tag, cls, text) => { const n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; };
  const convs = new Map();
  let db;

  const store = (mode, fn) => new Promise((res, rej) => {
    const t = db.transaction('convs', mode), r = fn(t.objectStore('convs'));
    t.oncomplete = () => res(r && r.result);
    t.onerror = t.onabort = () => rej(t.error);
  });

  function stats() {
    const by = {};
    let msgs = 0;
    for (const c of convs.values()) { by[c.source] = (by[c.source] || 0) + 1; msgs += c.messages.length; }
    const parts = Object.entries(by).map(([s, n]) => `${n} ${s}`);
    $('stats').textContent = convs.size ? `${parts.join(', ')} conversations · ${msgs} messages` : 'No chats yet. Import a Claude or ChatGPT data export (.zip) to start.';
  }

  function render() {
    const list = $('list');
    list.replaceChildren();
    const hits = searchConvs([...convs.values()], $('q').value);
    for (const { conv, snippet } of hits) {
      const b = el('button', 'item');
      b.append(el('b', '', conv.title || '(untitled)'), el('span', '', `${conv.source} · ${(conv.updated_at || '').slice(0, 10)}`), el('span', '', snippet));
      b.onclick = () => show(conv);
      list.append(b);
    }
    if ($('q').value.trim()) $('status').textContent = hits.length ? `${hits.length} matching conversation${hits.length > 1 ? 's' : ''}` : 'No matches.';
  }

  function show(conv) {
    $('ctitle').textContent = conv.title || '(untitled)';
    $('msgs').replaceChildren(...conv.messages.map(m => {
      const d = el('div', 'msg ' + m.role);
      d.append(el('small', '', m.role === 'user' ? 'You' : 'Assistant'), document.createTextNode(m.text));
      return d;
    }));
    $('home').hidden = true; $('conv').hidden = false; scrollTo(0, 0);
  }
  $('back').onclick = () => { $('conv').hidden = true; $('home').hidden = false; };

  $('file').onchange = async ev => {
    const counts = { new: 0, updated: 0, same: 0 };
    for (const file of ev.target.files) {
      $('status').textContent = `Reading ${file.name}…`;
      try {
        const changed = [];
        for (const doc of await readExport(file)) for (const c of detectAndParse(doc)) {
          if (!c.nid) continue;
          c.id = `${c.source}:${c.nid}`;
          const st = mergeStatus(convs.get(c.id), c);
          counts[st]++;
          if (st !== 'same') { convs.set(c.id, c); changed.push(c); }
        }
        if (changed.length) await store('readwrite', s => { for (const c of changed) s.put(c); });
      } catch (err) {
        $('status').textContent = `Couldn't import ${file.name}: ${err.message}`;
        ev.target.value = ''; stats(); render();
        return;
      }
    }
    ev.target.value = '';
    stats(); render();
    $('status').textContent = `Imported: ${counts.new} new, ${counts.updated} updated, ${counts.same} unchanged.`;
  };

  $('exp').onchange = ev => {
    const fmt = ev.target.value;
    ev.target.value = '';
    if (!fmt || !convs.size) return;
    const a = el('a');
    a.href = URL.createObjectURL(new Blob([exportText([...convs.values()], fmt)], { type: 'application/json' }));
    a.download = fmt === 'archive' ? 'chatvault-archive.json' : `chatvault-${fmt}.jsonl`;
    document.body.append(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 10000);
  };

  $('wipe').onclick = async () => {
    if (!convs.size || !confirm('Delete every chat stored in this browser? This cannot be undone.')) return;
    await store('readwrite', s => s.clear());
    convs.clear(); stats(); render();
    $('status').textContent = 'All chats deleted from this device.';
  };

  let timer;
  $('q').oninput = () => { clearTimeout(timer); $('status').textContent = ''; timer = setTimeout(render, 200); };

  try {
    db = await new Promise((res, rej) => {
      const r = indexedDB.open('chatvault', 1);
      r.onupgradeneeded = () => r.result.createObjectStore('convs', { keyPath: 'id' });
      r.onsuccess = () => res(r.result);
      r.onerror = () => rej(r.error);
    });
    for (const c of await store('readonly', s => s.getAll())) convs.set(c.id, c);
    if (navigator.storage && navigator.storage.persist) navigator.storage.persist();
  } catch (err) {
    $('status').textContent = "This browser won't let the page store data (private mode?), so imports are lost when you close the tab.";
    db = { transaction: () => { throw new Error('storage unavailable'); } };
  }
  stats(); render();
  if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
})();
</script>
</body>
</html>
